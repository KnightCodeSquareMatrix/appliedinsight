// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ── Mod JAR 拷贝任务 ─────────────────────────────────────────────────────────
// 用法: ./gradlew build -PmodsDir=/path/to/minecraft/mods
// 构建完成后将 mod jar 拷贝到指定目录。
def targetModsDir = rootProject.file(
    project.findProperty('modsDir') ?: 'run/mods'
)

def prismModsDir = rootProject.file(
    'C:/Users/KnightCode/AppData/Roaming/PrismLauncher/instances/1.21.1/minecraft/mods'
)

// 远程开发同步目录：构建后自动拷贝 jar 到此目录
// 本机运行 tools/sync_jar.py 通过 SSH 监听此文件变化，自动下载到本地 mods 文件夹
def fileServerDir = rootProject.file(
    project.findProperty('fileServerDir') ?: 'tools/serve'
)

tasks.register('copyModJar', Copy) {
    dependsOn jar
    from tasks.named('jar').map { it.archiveFile }
    into targetModsDir
    // 重命名以移除版本号，方便调试
    rename '(.+)-([0-9].+\\.jar)', '$1.jar'
    // 强制覆盖，即使 Gradle 认为已是最新
    outputs.upToDateWhen { false }
}

tasks.register('copyModJarToPrism', Copy) {
    dependsOn jar
    from tasks.named('jar').map { it.archiveFile }
    into prismModsDir
    // 重命名以移除版本号，方便调试
    rename '(.+)-([0-9].+\\.jar)', '$1.jar'
    // 强制覆盖，即使 Gradle 认为已是最新
    outputs.upToDateWhen { false }
}

// ── 拷贝到长期文件服务器目录 ─────────────────────────────────────────────────────
// 适用于远程开发：服务器上长期运行 HTTP 文件服务器，
// 每次 build 后自动更新 jar，本机通过固定 URL 下载。
tasks.register('copyModJarToFileServer', Copy) {
    dependsOn jar
    from tasks.named('jar').map { it.archiveFile }
    into fileServerDir
    rename '(.+)-([0-9].+\\.jar)', '$1.jar'
    outputs.upToDateWhen { false }
    doLast {
        logger.lifecycle("  ✓ jar 已更新到文件服务器目录: ${fileServerDir}/appliedinsight.jar")
    }
}

// ── 快速构建（跳过测试，直接拷贝到 Prism）─────────────────────────────────────────
tasks.register('quickBuild') {
    dependsOn 'jar', 'copyModJarToPrism'
    group = 'build'
    description = '跳过测试，只编译 + 打包 + 拷贝到 PrismLauncher，快速迭代用。'
}

// ── 打开 dumps 目录 ──────────────────────────────────────────────────────────
tasks.register('openDumpsDir') {
    doLast {
        def dumpsDir = rootProject.file('dumps/appliedinsight')
        dumpsDir.mkdirs()
        java.awt.Desktop.getDesktop().browse(dumpsDir.toURI())
    }
    group = 'utility'
    description = '在文件管理器中打开 dumps/appliedinsight 目录。'
}

// ── 打开 PrismLauncher mods 目录 ─────────────────────────────────────────────
tasks.register('openPrismMods') {
    doLast {
        prismModsDir.mkdirs()
        java.awt.Desktop.getDesktop().browse(prismModsDir.toURI())
    }
    group = 'utility'
    description = '在文件管理器中打开 PrismLauncher mods 目录。'
}

// ── 同步最新 dump 到 React 前端项目 ──────────────────────────────────────────
def reactDumpsDir = rootProject.file(
    'C:/Users/KnightCode/ReactProjects/as_storage/public/dumps'
)

tasks.register('syncDumpToReact', Copy) {
    from rootProject.file('dumps/appliedinsight')
    include '*.json'
    into reactDumpsDir
    // 只保留最新的各类型一份（按最后修改时间排序取最新的）
    eachFile { f ->
        def prefix = f.name.contains('me-dump') ? 'me-dump' :
                     f.name.contains('storage-analysis') ? 'storage-analysis' : null
        if (prefix != null) {
            // 删掉同类型旧文件
            delete(fileTree(reactDumpsDir).matching { include "${prefix}*.json" })
        }
    }
    outputs.upToDateWhen { false }
    group = 'utility'
    description = '从 dumps/appliedinsight 同步最新 JSON 到 React 项目的 public/dumps/。'
}

// build 时自动执行拷贝任务
// - 本地开发（Windows）：拷贝到 run/mods + PrismLauncher mods 目录
// - 远程开发（服务器）：拷贝到 run/mods + 文件服务器目录（本机通过 HTTP 下载）
tasks.named('build') {
    finalizedBy 'copyModJar'
    finalizedBy 'copyModJarToFileServer'
    if (prismModsDir.exists()) {
        finalizedBy 'copyModJarToPrism'
    }
}
